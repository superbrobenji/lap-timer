name: ci
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  hygiene:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: No trailing whitespace or CRLF in tracked text files (vendored files exempt)
        run: git diff --check $(git hash-object -t tree /dev/null) HEAD -- . ':!*.pbm' ':!*.bin' ':!components/core/include/core/jsmn.h' ':!devcontroller/components/webapi/host/jsmn.h' ':!devcontroller/components/webapi/host/jsmn.c'
      - name: No committed secrets or build output
        run: |
          ! git ls-files | grep -E '^test/build(-gcc)?/|\.pem$' | grep -v 'laptimer_pub\.pem$'
      - name: ESP-IDF container tag matches .idf-version
        run: grep -q "espressif/idf:$(cat .idf-version)$" .github/workflows/firmware.yml
      - name: spec §5.2 API blocks match components/core/include/core/*.h
        run: python3 tools/spec_api_check.py
      - name: No stale forward-looking comments (audit §3.2 -- comments used as a ledger)
        run: |
          # A comment that promises a future session is false the moment that session ships, and the
          # 2026-10-13 audit found 19 of them. Rewrite the comment as a true statement, or cite an
          # issue number. The pattern is never widened; instead the output is filtered through the
          # per-SITE allow-list below ("path|fixed substring of the line", no line numbers, so an
          # edit elsewhere in the file does not stale an entry). Every entry says why it is allowed:
          # an issue number = a stale survivor that issue owns (delete the entry with the rewrite);
          # otherwise the hit is TRUE today (a quote of the old comment, "later session" meaning a
          # riding session, or "until Plan N" naming an open owning plan). Any other hit fails.
          # An allow entry that matches no hit also fails (it went stale): whoever lands #129's
          # rewrites, or Plan 8 (imu_mpu6050, export_serial gps/imu raw) / Plan 6 (export_serial
          # power), rewrites the comment and deletes the matching entry in the same PR.
          allow=(
            # true: quotes the F2b-era comment it replaced
            "components/app/cmd/cmd.c|are later sessions"
            # stale, owner #129
            "components/app/cmd/cmd.c|not in plan 03"
            "components/app/cmd/cmd.c|weak-stubbed until 5.4"
            # true: "later session" = a later riding session (logger domain sense)
            "components/app/logger/logger.c|must not anchor a later session"
            "components/app/logger/logger.c|later session's HDR is right"
            # true: quotes the old comment it removed
            "components/app/pipeline/pipeline.c|lands in 3.4"
            # stale, owner #129 (CALIB_ORIENT itself: #93 / Plan 8)
            "components/app/pipeline/pipeline.c|CALIB_ORIENT: later sessions"
            # true: names the open owning plans (Plan 8 sensors, Plan 6 power)
            "components/drivers/export_serial/export_serial.c|are stubbed until the real sensor drivers land"
            # true: the MPU-6050 driver is the open Plan 8 deliverable
            "components/drivers/imu_mpu6050/CMakeLists.txt|The real I2C driver lands with the"
            "components/drivers/imu_mpu6050/imu_mpu6050.c|The real I2C driver (WHO_AM_I"
          )
          # git grep exits 1 on "no match"; that is the good case, not a job failure.
          hits=$(git grep -nIE 'lands in [0-9]|arrives in [0-9]|lands with the|later sessions?|stubbed until|stub until|not in plan [0-9]|Plan 04 ships no display' \
              -- components main tools docs ':!docs/reviews' ':!docs/superpowers' || true)
          bad=0
          used=" "
          while IFS= read -r hit; do
            [ -n "$hit" ] || continue
            ok=0
            for i in "${!allow[@]}"; do
              e="${allow[$i]}"
              if [[ "$hit" == "${e%%|*}:"* && "$hit" == *"${e#*|}"* ]]; then ok=1; used="$used$i "; break; fi
            done
            if [ "$ok" = 0 ]; then echo "stale forward-looking comment: $hit"; bad=1; fi
          done <<< "$hits"
          for i in "${!allow[@]}"; do
            case "$used" in
              *" $i "*) ;;
              *) echo "stale allow-list entry (matches no hit; delete it): ${allow[$i]}"; bad=1 ;;
            esac
          done
          exit "$bad"

  host-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - name: Probe inputs
        id: probe
        run: echo "present=$([ -f test/CMakeLists.txt ] && echo true || echo false)" >> "$GITHUB_OUTPUT"
      - name: Configure
        if: steps.probe.outputs.present == 'true'
        run: cmake -S test -B test/build -DCMAKE_BUILD_TYPE=Debug
      - name: Build
        if: steps.probe.outputs.present == 'true'
        run: cmake --build test/build --parallel
      - name: Test
        if: steps.probe.outputs.present == 'true'
        run: ctest --test-dir test/build --output-on-failure
      - name: Nothing to do
        if: steps.probe.outputs.present != 'true'
        run: echo "test/CMakeLists.txt not present yet"

  dc-host-tests:
    # Dev-controller (sub-project B) host harness -- mirrors host-tests above, but for
    # devcontroller/test (Plan 5.6 closeout): the pure, IDF-free component logic under
    # devcontroller/components/*/host/*.c, built and run under ASan/UBSan as 24 Unity
    # executables (devcontroller/test/CMakeLists.txt).
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - name: Probe inputs
        id: probe
        run: echo "present=$([ -f devcontroller/test/CMakeLists.txt ] && echo true || echo false)" >> "$GITHUB_OUTPUT"
      - name: Configure
        if: steps.probe.outputs.present == 'true'
        run: cmake -S devcontroller/test -B devcontroller/test/build -DCMAKE_BUILD_TYPE=Debug
      - name: Build
        if: steps.probe.outputs.present == 'true'
        run: cmake --build devcontroller/test/build --parallel
      - name: Test
        if: steps.probe.outputs.present == 'true'
        run: ctest --test-dir devcontroller/test/build --output-on-failure
      - name: Nothing to do
        if: steps.probe.outputs.present != 'true'
        run: echo "devcontroller/test/CMakeLists.txt not present yet"

  tools-tests:
    # Python/bash unit tests for tools/ host CLIs and linters. Stdlib only -- pyserial is imported
    # lazily inside devkit.py (only where a real port is opened), so none of this needs an install
    # step, and no test here needs ESP-IDF, a board, or a signing key.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: python3 -m unittest (devkit, linters, spec API, track generator)
        run: |
          python3 -m unittest -v \
            tools/test_devkit.py \
            tools/lint/test_power_of_10.py \
            tools/lint/test_venue_announce.py \
            tools/test_spec_api_check.py \
            tools/tracks/test_gen_tracks.py
      - name: sign_release.sh guard harness (dry-run; no IDF, no key)
        run: bash tools/test_sign_release.sh

  static-analysis:
    # Power of 10 (Holzmann/JPL) static analysis -- design §5, amended by the 2026-10-13 audit fix
    # wave (ruling R12). BLOCKING: the custom linter is the authoritative rule 1/3/4/4-compound/5/
    # 8/9 gate and FAILS the job on any un-graced violation. Together with the build jobs' -Werror
    # set (the rule-6 -Wmissing-prototypes/-declarations, -Wshadow, -Wconversion) this gates the
    # ten rules. clang-tidy and cppcheck stay `continue-on-error: true` (advisory second analysers,
    # rule 10) -- see design §5. Ruling R13 (2026-10-13 audit fix wave) designates `static-analysis`
    # as one of the nine required checks Task 14 will enable in branch protection; it is not yet
    # enforced there as of this commit.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - name: Install cppcheck + clang-tidy
        run: sudo apt-get update && sudo apt-get install -y cppcheck clang-tidy
      # ROLLOUT GRACE (ruling R12, two-step): the tightened checks land before the plans that own
      # the offending files. Each entry names a finding that still matches and is owned by another
      # layer; the linter prints GRACE-STALE for any entry that stops matching, and that entry is
      # deleted from the list when its owner fixes the site. Removed 2026-10-15 after their owners
      # fixed them: cfg_json.c:walk:RULE-1 (F1b, ruling R27) and board.c:cmp_int:RULE-9 (F2a,
      # ruling R19). Remaining graced sites, by owning layer (the list is not empty):
      #   app layer:     components/app/sys/lt_nvs.c:errlog_add:RULE-5
      #   core:          components/core/config/cfg.c:cfg_defaults:RULE-5
      #   core:          components/core/config/cfg_json.c:cfg_to_json:RULE-4
      #   drivers layer: components/drivers/export_serial/export_serial.c:fmt_from_str:RULE-5
      #   drivers layer: components/drivers/export_serial/export_serial.c:tally_cb:RULE-5
      # Issue for all five: filed by F4 Task 14 Step 1 (Power-of-10 statement-count findings).
      - name: power_of_10.py linter (BLOCKING; rules 1/3/4/4-compound/5/8/9)
        run: |
          python3 tools/lint/power_of_10.py --enforce-fnptr --fail-on-violation \
            --report-only-sites "components/app/sys/lt_nvs.c:errlog_add:RULE-5,components/core/config/cfg.c:cfg_defaults:RULE-5,components/core/config/cfg_json.c:cfg_to_json:RULE-4,components/drivers/export_serial/export_serial.c:fmt_from_str:RULE-5,components/drivers/export_serial/export_serial.c:tally_cb:RULE-5"
      - name: "venue-announce check (BLOCKING; #98 -- every direct venue set announces to the ui)"
        run: python3 tools/lint/venue_announce.py --fail-on-violation
      - name: cppcheck (warning+style+portability; design §5 second analyser, rule 10)
        continue-on-error: true
        run: |
          cppcheck --enable=warning,style,portability --std=c11 --error-exitcode=0 --quiet \
            -I components/core/include -I components/core/ui/include \
            -I components/app/include -I components/lt_hal/include \
            -I components/drivers/export_serial/include \
            --suppress=missingInclude \
            --suppress='*:components/core/util/jsmn.c' \
            --suppress='*:test/unity/*' \
            components/core components/app components/drivers main
      - name: Probe host compile database inputs
        id: probe
        run: echo "present=$([ -f test/CMakeLists.txt ] && echo true || echo false)" >> "$GITHUB_OUTPUT"
      - name: Configure host compile database (test/build; the same tree host-tests builds)
        if: steps.probe.outputs.present == 'true'
        run: cmake -S test -B test/build -DCMAKE_EXPORT_COMPILE_COMMANDS=ON
      # clang-tidy needs a compile database. The host CMake DB above covers components/core (it
      # links every components/core/*.c into libcore -- see test/CMakeLists.txt); a full
      # components/app + components/drivers + main compile DB only exists from an ESP-IDF build
      # (idf.py build emits build/<env>/compile_commands.json in firmware.yml's container).
      # Wiring an IDF container build into this report-only job just to get a second, larger
      # compile database is disproportionate for this session -- cppcheck and the linter above
      # already run over components/app, components/drivers and main report-only. So: clang-tidy
      # runs over components/core (host DB) only, for now.
      # TODO(4.5.x): add clang-tidy over components/app, components/drivers and main via the IDF
      # compile database once an IDF-container step exists in this job (or firmware.yml uploads
      # its compile_commands.json for this job to consume).
      - name: clang-tidy over components/core (host compile DB; advisory)
        if: steps.probe.outputs.present == 'true'
        continue-on-error: true
        run: |
          # Only .c files: each is its own translation unit in the compile DB and pulls in its
          # own headers, so clang-tidy still sees + reports (per HeaderFilterRegex) the in-scope
          # headers without needing a compile-command entry for a .h on its own. jsmn.c is
          # vendored (design §1) and excluded.
          # ADVISORY (continue-on-error): the CI runner's clang-tidy version emits a large,
          # version-dependent volume of clang-diagnostic-* header noise here that is not
          # Power-of-10 and does not reproduce with the local toolchain, so gating merges on it is
          # unreliable. The blocking Power-of-10 gates are the custom linter step above
          # (--fail-on-violation --enforce-fnptr) and the build jobs' -Werror set (incl. the rule-6
          # -Wmissing-* warnings). clang-tidy runs here as a reported second analyser (rule 10).
          find components/core -name '*.c' -not -path 'components/core/util/jsmn.c' -print0 \
            | xargs -0 clang-tidy -p test/build --quiet

  tracks-generated:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Probe inputs
        id: probe
        run: echo "present=$([ -f tools/tracks/gen_tracks.py ] && echo true || echo false)" >> "$GITHUB_OUTPUT"
      - name: Regenerate bundled tracks and check they are committed
        if: steps.probe.outputs.present == 'true'
        run: |
          python3 tools/tracks/gen_tracks.py tools/tracks/*.json -o components/core/tracks/trk_bundled.c
          git diff --exit-code components/core/tracks/trk_bundled.c
      - name: Nothing to do
        if: steps.probe.outputs.present != 'true'
        run: echo "tools/tracks/gen_tracks.py not present yet"

  coverage:
    # §22.1's "≥ 90 % lines in core/ (gcov in CI)" had no job at all (audit §3.3 item 28). This is
    # the ADVISORY line-coverage report the amended §22.1 describes: it never fails the build and
    # is not a required check -- it prints the percentage so a drop is visible in the PR.
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - name: Install gcovr
        run: sudo apt-get update && sudo apt-get install -y gcovr
      - name: Configure + build + run the host suite with --coverage
        run: |
          cmake -S test -B test/build-cov -DCMAKE_BUILD_TYPE=Debug \
                -DCMAKE_C_FLAGS="--coverage -O0" -DCMAKE_EXE_LINKER_FLAGS="--coverage"
          cmake --build test/build-cov --parallel
          ctest --test-dir test/build-cov --output-on-failure
      - name: gcovr over components/core
        run: |
          gcovr --root . --filter 'components/core/' \
                --exclude 'components/core/util/jsmn.c' \
                --exclude 'components/core/ui/fonts.c' \
                --exclude 'components/core/ui/icons.c' \
                --print-summary --xml-pretty -o coverage.xml | tee cov.txt
          echo "### core/ line coverage" >> "$GITHUB_STEP_SUMMARY"
          grep -E '^lines:' cov.txt >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v4
        with:
          name: coverage-core
          path: coverage.xml
          if-no-files-found: ignore
