name: ci
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  hygiene:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: No trailing whitespace or CRLF in tracked text files (vendored files exempt)
        run: git diff --check $(git hash-object -t tree /dev/null) HEAD -- . ':!*.pbm' ':!*.bin' ':!components/core/include/core/jsmn.h' ':!devcontroller/components/webapi/host/jsmn.h' ':!devcontroller/components/webapi/host/jsmn.c'
      - name: No committed secrets or build output
        run: |
          ! git ls-files | grep -E '^test/build(-gcc)?/|\.pem$' | grep -v 'laptimer_pub\.pem$'
      - name: ESP-IDF container tag matches .idf-version
        run: grep -q "espressif/idf:$(cat .idf-version)$" .github/workflows/firmware.yml

  host-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - name: Probe inputs
        id: probe
        run: echo "present=$([ -f test/CMakeLists.txt ] && echo true || echo false)" >> "$GITHUB_OUTPUT"
      - name: Configure
        if: steps.probe.outputs.present == 'true'
        run: cmake -S test -B test/build -DCMAKE_BUILD_TYPE=Debug
      - name: Build
        if: steps.probe.outputs.present == 'true'
        run: cmake --build test/build --parallel
      - name: Test
        if: steps.probe.outputs.present == 'true'
        run: ctest --test-dir test/build --output-on-failure
      - name: Nothing to do
        if: steps.probe.outputs.present != 'true'
        run: echo "test/CMakeLists.txt not present yet"

  dc-host-tests:
    # Dev-controller (sub-project B) host harness -- mirrors host-tests above, but for
    # devcontroller/test (Plan 5.6 closeout): the pure, IDF-free component logic under
    # devcontroller/components/*/host/*.c, built and run under ASan/UBSan as 24 Unity
    # executables (devcontroller/test/CMakeLists.txt).
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - name: Probe inputs
        id: probe
        run: echo "present=$([ -f devcontroller/test/CMakeLists.txt ] && echo true || echo false)" >> "$GITHUB_OUTPUT"
      - name: Configure
        if: steps.probe.outputs.present == 'true'
        run: cmake -S devcontroller/test -B devcontroller/test/build -DCMAKE_BUILD_TYPE=Debug
      - name: Build
        if: steps.probe.outputs.present == 'true'
        run: cmake --build devcontroller/test/build --parallel
      - name: Test
        if: steps.probe.outputs.present == 'true'
        run: ctest --test-dir devcontroller/test/build --output-on-failure
      - name: Nothing to do
        if: steps.probe.outputs.present != 'true'
        run: echo "devcontroller/test/CMakeLists.txt not present yet"

  tools-tests:
    # Python unit tests for tools/ host CLIs (Plan 5.6 closeout: tools/devkit.py). Stdlib only --
    # pyserial is imported lazily inside devkit.py (only where a real port is opened), so this
    # exercises devkit.py's pure helpers (read_json/send_cmd/stage_image/push_and_wait) against a
    # FakeSerial double with no install step needed.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Probe inputs
        id: probe
        run: echo "present=$([ -f tools/test_devkit.py ] && echo true || echo false)" >> "$GITHUB_OUTPUT"
      - name: python3 -m unittest tools/test_devkit.py
        if: steps.probe.outputs.present == 'true'
        run: python3 -m unittest tools/test_devkit.py
      - name: Nothing to do
        if: steps.probe.outputs.present != 'true'
        run: echo "tools/test_devkit.py not present yet"

  static-analysis:
    # Power of 10 (Holzmann/JPL) static analysis -- design §5, plan Session 4.5.6 (blocking flip).
    # BLOCKING as of plan-4.5-done: the custom linter (the authoritative rule 3/4/4-compound/5/8/9
    # gate) FAILS the job on any violation. Together with the build jobs' -Werror set (the rule-6
    # -Wmissing-prototypes/-declarations, -Wshadow, -Wconversion) this precisely and comprehensively
    # gates the ten rules. clang-tidy and cppcheck stay `continue-on-error: true` (advisory second
    # analysers, rule 10 "preferably more than one"): their output is largely non-Power-of-10 and,
    # for the runner's clang-tidy, a version-dependent flood that does not reproduce locally, so
    # gating merges on them is unreliable/disproportionate -- see design §5.
    # To make this a merge gate, add `static-analysis` to the branch-protection required checks
    # (a GitHub repo setting, not expressible here).
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - name: Install cppcheck + clang-tidy
        run: sudo apt-get update && sudo apt-get install -y cppcheck clang-tidy
      - name: power_of_10.py linter (BLOCKING; rules 3/4/4-compound/5/8/9)
        run: python3 tools/lint/power_of_10.py --enforce-fnptr --fail-on-violation
      - name: cppcheck (warning+style+portability; design §5 second analyser, rule 10)
        continue-on-error: true
        run: |
          cppcheck --enable=warning,style,portability --std=c11 --error-exitcode=0 --quiet \
            -I components/core/include -I components/core/ui/include \
            -I components/app/include -I components/lt_hal/include \
            -I components/drivers/export_serial/include \
            --suppress=missingInclude \
            --suppress='*:components/core/util/jsmn.c' \
            --suppress='*:test/unity/*' \
            components/core components/app components/drivers main
      - name: Probe host compile database inputs
        id: probe
        run: echo "present=$([ -f test/CMakeLists.txt ] && echo true || echo false)" >> "$GITHUB_OUTPUT"
      - name: Configure host compile database (test/build; the same tree host-tests builds)
        if: steps.probe.outputs.present == 'true'
        run: cmake -S test -B test/build -DCMAKE_EXPORT_COMPILE_COMMANDS=ON
      # clang-tidy needs a compile database. The host CMake DB above covers components/core (it
      # links every components/core/*.c into libcore -- see test/CMakeLists.txt); a full
      # components/app + components/drivers + main compile DB only exists from an ESP-IDF build
      # (idf.py build emits build/<env>/compile_commands.json in firmware.yml's container).
      # Wiring an IDF container build into this report-only job just to get a second, larger
      # compile database is disproportionate for this session -- cppcheck and the linter above
      # already run over components/app, components/drivers and main report-only. So: clang-tidy
      # runs over components/core (host DB) only, for now.
      # TODO(4.5.x): add clang-tidy over components/app, components/drivers and main via the IDF
      # compile database once an IDF-container step exists in this job (or firmware.yml uploads
      # its compile_commands.json for this job to consume) -- likely alongside the rule 9
      # (Session 4.5.5) or blocking-flip (Session 4.5.6) work.
      - name: clang-tidy over components/core (host compile DB; advisory)
        if: steps.probe.outputs.present == 'true'
        continue-on-error: true
        run: |
          # Only .c files: each is its own translation unit in the compile DB and pulls in its
          # own headers, so clang-tidy still sees + reports (per HeaderFilterRegex) the in-scope
          # headers without needing a compile-command entry for a .h on its own. jsmn.c is
          # vendored (design §1) and excluded.
          # ADVISORY (continue-on-error): the CI runner's clang-tidy version emits a large,
          # version-dependent volume of clang-diagnostic-* header noise here that is not
          # Power-of-10 and does not reproduce with the local toolchain, so gating merges on it is
          # unreliable. The blocking Power-of-10 gates are the custom linter step above
          # (--fail-on-violation --enforce-fnptr) and the build jobs' -Werror set (incl. the rule-6
          # -Wmissing-* warnings). clang-tidy runs here as a reported second analyser (rule 10).
          find components/core -name '*.c' -not -path 'components/core/util/jsmn.c' -print0 \
            | xargs -0 clang-tidy -p test/build --quiet

  tracks-generated:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Probe inputs
        id: probe
        run: echo "present=$([ -f tools/tracks/gen_tracks.py ] && echo true || echo false)" >> "$GITHUB_OUTPUT"
      - name: Regenerate bundled tracks and check they are committed
        if: steps.probe.outputs.present == 'true'
        run: |
          python3 tools/tracks/gen_tracks.py tools/tracks/*.json -o components/core/tracks/trk_bundled.c
          git diff --exit-code components/core/tracks/trk_bundled.c
      - name: Nothing to do
        if: steps.probe.outputs.present != 'true'
        run: echo "tools/tracks/gen_tracks.py not present yet"
