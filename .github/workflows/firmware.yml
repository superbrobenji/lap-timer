name: firmware
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        env: [moto_neo6m, moto_sim, devcontroller]
    container:
      image: espressif/idf:v5.3.2
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          submodules: recursive
      - name: Probe inputs
        id: probe
        run: echo "present=$([ -f build.sh ] && echo true || echo false)" >> "$GITHUB_OUTPUT"
      - name: Probe core_selftest
        id: probe_selftest
        run: echo "present=$([ -f test_apps/core_selftest/CMakeLists.txt ] && echo true || echo false)" >> "$GITHUB_OUTPUT"
      - name: Build core_selftest (ESP32)
        if: steps.probe_selftest.outputs.present == 'true' && matrix.env == 'moto_neo6m'
        shell: bash
        run: |
          . $IDF_PATH/export.sh
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          idf.py -C test_apps/core_selftest -B test_apps/core_selftest/build set-target esp32 build
      - name: Build ${{ matrix.env }}
        if: steps.probe.outputs.present == 'true' && matrix.env != 'devcontroller'
        shell: bash
        run: |
          . $IDF_PATH/export.sh
          ./build.sh ${{ matrix.env }} build
          ./build.sh ${{ matrix.env }} size
      - uses: actions/upload-artifact@v4
        if: steps.probe.outputs.present == 'true' && matrix.env != 'devcontroller'
        with:
          name: laptimer-${{ matrix.env }}
          path: |
            build/${{ matrix.env }}/**/*.bin
            build/${{ matrix.env }}/flasher_args.json
          if-no-files-found: ignore
      - name: Nothing to do
        if: steps.probe.outputs.present != 'true' && matrix.env != 'devcontroller'
        run: echo "build.sh not present yet"
      # devcontroller (sub-project B, dev-kit) is a sibling ESP-IDF project (devcontroller/) with
      # its own CMakeLists.txt, not one of the lap-timer's build.sh named environments -- so it is
      # NOT built via ./build.sh (Plan 5.6 closeout). Same pinned container/IDF version as the
      # moto_* builds above; devcontroller/main/CMakeLists.txt carries its own -Werror set, so
      # `idf.py build` fails on any warning just like the lap-timer builds.
      - name: Build devcontroller (idf.py build)
        if: matrix.env == 'devcontroller'
        shell: bash
        working-directory: devcontroller
        run: |
          . $IDF_PATH/export.sh
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          idf.py build
      - uses: actions/upload-artifact@v4
        if: matrix.env == 'devcontroller'
        with:
          name: devcontroller
          path: |
            devcontroller/build/devcontroller.bin
            devcontroller/build/bootloader/bootloader.bin
            devcontroller/build/partition_table/partition-table.bin
            devcontroller/build/www.bin
            devcontroller/build/flasher_args.json
          if-no-files-found: ignore
