name: firmware
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        env: [moto_neo6m, moto_sim]
    container:
      image: espressif/idf:v5.3.2
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          submodules: recursive
      - name: Probe inputs
        id: probe
        run: echo "present=$([ -f build.sh ] && echo true || echo false)" >> "$GITHUB_OUTPUT"
      - name: Build ${{ matrix.env }}
        if: steps.probe.outputs.present == 'true'
        shell: bash
        run: |
          . $IDF_PATH/export.sh
          ./build.sh ${{ matrix.env }} build
          ./build.sh ${{ matrix.env }} size
      - uses: actions/upload-artifact@v4
        if: steps.probe.outputs.present == 'true'
        with:
          name: laptimer-${{ matrix.env }}
          path: |
            build/${{ matrix.env }}/**/*.bin
            build/${{ matrix.env }}/flasher_args.json
          if-no-files-found: ignore
      - name: Nothing to do
        if: steps.probe.outputs.present != 'true'
        run: echo "build.sh not present yet"
