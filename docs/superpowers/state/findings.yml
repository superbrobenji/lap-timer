- id: B5-FIX-5
  source: review
  severity: LOW
  class: 'gate_plan.plans_in_flight (this block''s Task 6 code, gate_plan.py:493-511)
    reads an uncommitted ledger change as ''not in flight'' in two cases the b5 second-pass
    verifier reproduced: (a) a ledger deleted in the working tree while it ends in
    CHECKPOINT at HEAD (the working-tree glob never sees it); (b) extra ledger lines
    staged in the index while the working file equals HEAD (only working bytes are
    compared with HEAD); DEC-0034 widen-fix5: the three copies (HEAD, index, working
